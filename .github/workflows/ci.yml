name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: vigil
          POSTGRES_PASSWORD: vigil
          POSTGRES_DB: vigil
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vigil"
          --health-interval 5s
          --health-retries 10
    env:
      VIGIL_TEST_DATABASE_URL: postgres://vigil:vigil@localhost:5432/vigil?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - run: go build ./cmd/vigil
