services:
  vigil:
    build: ..
    ports: ["8080:8080"]
    environment:
      DATABASE_URL: postgres://vigil:vigil@postgres:5432/vigil?sslmode=disable
      KAFKA_BROKER: redpanda:9092
    volumes:
      - ../vigil.example.yaml:/etc/vigil/vigil.yaml:ro
    depends_on:
      postgres: {condition: service_healthy}
      redpanda: {condition: service_healthy}
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: vigil
      POSTGRES_PASSWORD: vigil
      POSTGRES_DB: vigil
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vigil"]
      interval: 5s
      retries: 10

  redpanda:
    image: redpandadata/redpanda:v24.2.7
    command:
      - redpanda start --mode dev-container --smp 1 --overprovisioned
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
    ports: ["19092:19092"]
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 5s
      retries: 20

  prometheus:
    image: prom/prometheus:v2.54.1
    volumes: [./prometheus.yml:/etc/prometheus/prometheus.yml:ro]
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:11.2.2
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes: [./grafana/provisioning:/etc/grafana/provisioning:ro]
    ports: ["3000:3000"]

volumes:
  pgdata:
